# Render blueprint: web interface, agent service, MCP engine server and hosting service.
services:
  - type: web
    name: nodomics-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nodomics/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The hub (ADR 0018). Both are public by design: the key is Supabase's publishable key and
      # every table is protected by Row Level Security. Set them in the Render dashboard.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # The hosting service (ADR 0027). Without it, the Despliegue tab says hosting is unavailable.
      - key: VITE_DEPLOY_URL
        sync: false
    # The app routes /hub, /u/<handle> and /hub/<handle>/<slug> in the browser.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints every file in assets/, so they never change under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
  - type: web
    name: nodomics-agent
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/agent/src/start.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MCP_URL
        sync: false
      - key: AGENT_MEMORY
        sync: false
      - key: AGENT_ALLOWED_ORIGINS
        sync: false
      - key: AGENT_ALLOW_FAKES
        sync: false
      - key: RENDER_SANDBOX_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: SANDBOX_ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: nodomics-mcp
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nodomics/mcp build
    startCommand: node apps/mcp/dist/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
  # Deploys hosting nodes (ADR 0027). RENDER_API_KEY belongs to a dedicated Render account that
  # does not host these services; SUPABASE_SERVICE_ROLE_KEY writes the deployments table.
  - type: web
    name: nodomics-deploy
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/deploy/src/start.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: DEPLOY_ALLOWED_ORIGINS
        sync: false
