# Render blueprint: the web app as a static site. The browser engine (DuckDB-wasm and Pyodide)
# runs in the visitor's browser, so no server is needed.
services:
  - type: web
    name: nodomics-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nodomics/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The hub (ADR 0018). Both are public by design: the key is Supabase's publishable key and
      # every table is protected by Row Level Security. Set them in the Render dashboard.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    # The app routes /hub, /u/<handle> and /hub/<handle>/<slug> in the browser.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints every file in assets/, so they never change under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
