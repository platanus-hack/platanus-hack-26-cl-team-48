[project]
name = "nodomics-engine"
version = "0.1.0"
description = "Local Nodomics executor: DuckDB and CPython behind a WebSocket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "jedi==0.20.1",
    "jsonschema==4.26.0",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "websockets==17.3",
]

[project.scripts]
nodomics-engine = "nodomics_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodomics_engine"]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "pandas-stubs==3.0.5.260914",
    "pyarrow-stubs==20.0.0.20260819",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "types-jsonschema==4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "ANN"]
# PLR0911: converters written as one `match` return from each case on purpose.
ignore = ["PLR2004", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
