<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estado vacío</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="preview.css" />
    <script src="theme-toggle.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <a href="index.html">Sistema de diseño</a>
      <button type="button" class="toggle" data-theme-toggle>Claro / Oscuro</button>
    </header>
    <main>
      <h1>Estado vacío</h1>
      <p class="lead">
        Un chip, una línea de explicación y la acción a seguir. Nunca datos de ejemplo.
      </p>
      <div class="empty">
        <span class="chip"
          ><svg
            class="icon"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="width: var(--icon-chip-glyph); height: var(--icon-chip-glyph)"
          >
            <rect width="8" height="8" x="3" y="3" rx="2" />
            <path d="M7 11v4a2 2 0 0 0 2 2h4" />
            <rect width="8" height="8" x="13" y="13" rx="2" /></svg
        ></span>
        <p>Todavía no hay flujos guardados.</p>
        <button class="nd-btn nd-btn-primary" type="button">Nuevo flujo</button>
      </div>
    </main>
  </body>
</html>
