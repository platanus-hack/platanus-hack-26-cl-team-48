<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Botones</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="preview.css" />
    <script src="theme-toggle.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <a href="index.html">Sistema de diseño</a>
      <button type="button" class="toggle" data-theme-toggle>Claro / Oscuro</button>
    </header>
    <main>
      <h1>Botones</h1>
      <p class="lead">
        Los estilos son los de <code>@nodomics/ui</code> (<code>components.css</code>). Una página
        tiene una sola acción primaria.
      </p>
      <div class="row">
        <button class="nd-btn nd-btn-primary" type="button">Entrar</button
        ><button class="nd-btn nd-btn-secondary" type="button">Secundario</button
        ><button class="nd-btn nd-btn-ghost" type="button">Fantasma</button
        ><button class="nd-btn nd-btn-danger" type="button">Borrar</button
        ><button class="nd-btn nd-btn-primary" type="button" disabled>Deshabilitado</button>
      </div>
      <div class="row">
        <button class="nd-btn nd-btn-primary nd-btn-sm" type="button">Pequeño</button
        ><button class="nd-btn nd-btn-primary" type="button">Mediano</button
        ><button class="nd-btn nd-btn-primary nd-btn-lg" type="button">Grande</button>
      </div>
    </main>
  </body>
</html>
